<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Playlists</title>
    <meta name="theme-color" content="#0f2027">
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="dns-prefetch" href="https://i.ytimg.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 2rem 4rem;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #a0aec0;
            font-size: 1.1rem;
        }

        .back-link {
            position: absolute;
            top: 2.6rem;
            left: 4rem;
            color: #8fd3f4;
            text-decoration: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #84fab0;
        }

        .main-content {
            flex: 1;
            padding: clamp(1.25rem, 3vw, 4rem);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
            gap: clamp(1rem, 2vw, 2rem);
            width: 100%;
            max-width: 1400px;
        }

        :focus-visible {
            outline: 2px solid #8fd3f4;
            outline-offset: 3px;
        }

        .search {
            position: relative;
            max-width: 520px;
            margin: 1.5rem auto 0;
        }

        .search svg {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }

        .search input {
            width: 100%;
            padding: 0.85rem 5.5rem 0.85rem 2.75rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        .search input:focus {
            border-color: #8fd3f4;
            box-shadow: 0 0 0 4px rgba(143, 211, 244, 0.15);
        }

        .search-count {
            position: absolute;
            right: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            color: #a0aec0;
            font-variant-numeric: tabular-nums;
            pointer-events: none;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: #a0aec0;
            padding: 3rem 1rem;
        }

        /* No backdrop-filter: with 176 cards it is invisible over a flat gradient but very costly. */
        .card {
            position: relative;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            padding: 1.4rem;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease, background 0.3s ease;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            cursor: pointer;
            content-visibility: auto;
            contain-intrinsic-size: auto 170px;
            animation: cardIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
            animation-delay: calc(var(--i, 0) * 20ms);
        }

        .card:hover,
        .card:focus-visible {
            transform: translateY(-5px);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.38);
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.07));
            border-color: rgba(143, 211, 244, 0.45);
        }

        .card[hidden] {
            display: none;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .card-icon {
            width: 2.8rem;
            height: 2.8rem;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: rgba(255, 0, 0, 0.16);
            border: 1px solid rgba(255, 80, 80, 0.3);
            color: #ff6b6b;
            margin-bottom: 0.25rem;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.3s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.08);
            background: rgba(255, 0, 0, 0.28);
        }

        .player-loading {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: #000;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .player-loading.hidden {
            opacity: 0;
        }

        .player-loading::after {
            content: '';
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #84fab0;
            border-right-color: #8fd3f4;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .card,
            .modal-overlay,
            .modal-container {
                animation: none;
                transition: none;
            }
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #8fd3f4;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .card-footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            color: #a0aec0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            width: 90%;
            max-width: 1200px;
            height: 85vh;
            background: #1a202c;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            padding: 1.25rem 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #84fab0;
        }

        .modal-external-link {
            color: #8fd3f4;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .modal-external-link:hover {
            text-decoration: underline;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: #e53e3e;
            transform: rotate(90deg);
        }

        .modal-body {
            flex: 1;
            display: flex;
            background: #000;
            overflow: hidden;
        }

        .video-player-container {
            flex: 1;
            position: relative;
        }

        .video-player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-sidebar {
            width: 350px;
            background: #111827;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .video-item {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .video-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .video-item.active {
            background: rgba(132, 250, 176, 0.1);
            border-left: 3px solid #84fab0;
        }

        .video-item-number {
            font-size: 0.9rem;
            color: #718096;
            min-width: 24px;
        }

        .video-item-title {
            font-size: 0.95rem;
            color: #e2e8f0;
            line-height: 1.4;
            flex: 1;
        }

        .video-item.active .video-item-title {
            color: #84fab0;
            font-weight: 500;
        }


        @media (max-width: 1024px) {
            .header {
                padding: 1.75rem 2rem;
            }

            .back-link {
                left: 2rem;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 4rem 1.25rem 1.5rem;
            }

            .back-link {
                top: 1.5rem;
                left: 1.25rem;
            }

            .modal-container {
                width: 100%;
                height: 100%;
                border-radius: 0;
            }

            .modal-body {
                flex-direction: column;
            }

            .video-sidebar {
                width: 100%;
                height: 30vh;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
            }

            .modal-header {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <a href="../index.html" class="back-link">← Back to Dashboard</a>
        <h1>YouTube Playlists</h1>
        <p>Curated educational videos and series</p>
        <div class="search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
            </svg>
            <input type="search" id="playlistSearch" placeholder="Search playlists…" aria-label="Search playlists"
                autocomplete="off" spellcheck="false">
            <span class="search-count" id="searchCount" aria-live="polite"></span>
        </div>
    </header>

    <main class="main-content">
        <div class="grid" id="playlistsGrid">
            <!-- Dynamically populated via JS -->
        </div>
    </main>

    <div class="modal-overlay" id="videoModalOverlay" aria-hidden="true">
        <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <div class="modal-title-group">
                    <h2 class="modal-title" id="modalTitle">Loading...</h2>
                    <a href="#" target="_blank" rel="noopener noreferrer" class="modal-external-link" id="modalLink">
                        Watch directly on YouTube ↗
                    </a>
                </div>
                <button class="modal-close" id="modalCloseBtn" aria-label="Close player">×</button>
            </div>
            <div class="modal-body">
                <div class="video-player-container">
                    <div class="player-loading hidden" id="playerLoading" aria-hidden="true"></div>
                    <iframe id="youtubePlayer" title="YouTube player"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen></iframe>
                </div>
                <div class="video-sidebar" id="videoSidebar">
                    <!-- Dynamic videos here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Data Import -->
    <script src="playlists-data.js"></script>

    <!-- Render Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('playlistsGrid');
            const overlay = document.getElementById('videoModalOverlay');
            const closeBtn = document.getElementById('modalCloseBtn');
            const youtubePlayer = document.getElementById('youtubePlayer');
            const modalTitle = document.getElementById('modalTitle');
            const modalLink = document.getElementById('modalLink');
            const videoSidebar = document.getElementById('videoSidebar');

            const searchInput = document.getElementById('playlistSearch');
            const searchCount = document.getElementById('searchCount');
            const playerLoading = document.getElementById('playerLoading');
            const PLAY_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11-6.86a1 1 0 0 0 0-1.7l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>';
            const cards = [];
            let lastFocused = null;

            function el(tag, className, text) {
                const node = document.createElement(tag);
                if (className) node.className = className;
                if (text !== undefined) node.textContent = text;
                return node;
            }

            // Render cards
            if (typeof playlists !== 'undefined') {
                const fragment = document.createDocumentFragment();
                playlists.forEach((playlist, index) => {
                    const card = el('div', 'card');
                    card.tabIndex = 0;
                    card.setAttribute('role', 'button');
                    card.style.setProperty('--i', Math.min(index, 24));

                    const icon = el('div', 'card-icon');
                    icon.innerHTML = PLAY_ICON;
                    const footer = el('div', 'card-footer');
                    footer.appendChild(el('span', '', `Playlist #${playlist.id}`));
                    if (playlist.videos && playlist.videos.length) {
                        footer.appendChild(el('span', '', `${playlist.videos.length} videos`));
                    }
                    card.append(icon, el('div', 'card-title', playlist.name), footer);

                    card.addEventListener('click', () => openModal(playlist));
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            openModal(playlist);
                        }
                    });

                    fragment.appendChild(card);
                    cards.push({ card, haystack: `${playlist.id} ${playlist.name}`.toLowerCase() });
                });
                grid.appendChild(fragment);
            } else {
                grid.innerHTML = '<p class="no-results">Error loading playlists data.</p>';
            }

            const noResults = el('p', 'no-results', 'No playlists match your search.');
            noResults.hidden = true;
            grid.appendChild(noResults);

            function updateCount(visible) {
                searchCount.textContent = visible === cards.length ? `${cards.length}` : `${visible} / ${cards.length}`;
            }
            updateCount(cards.length);

            let searchTimer;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => {
                    const terms = searchInput.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
                    let visible = 0;
                    cards.forEach(({ card, haystack }) => {
                        const match = terms.every(t => haystack.includes(t));
                        card.hidden = !match;
                        if (match) visible++;
                    });
                    noResults.hidden = visible !== 0;
                    updateCount(visible);
                }, 60);
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement !== searchInput && !overlay.classList.contains('active')) {
                    e.preventDefault();
                    searchInput.focus();
                }
            });

            youtubePlayer.addEventListener('load', () => playerLoading.classList.add('hidden'));

            function setPlayerSrc(src) {
                if (!src) {
                    youtubePlayer.removeAttribute('src');
                    playerLoading.classList.add('hidden');
                    return;
                }
                playerLoading.classList.remove('hidden');
                youtubePlayer.src = src;
            }

            function openModal(playlist) {
                lastFocused = document.activeElement;
                modalTitle.textContent = playlist.name;
                modalLink.href = playlist.url;
                videoSidebar.replaceChildren();

                if (playlist.playlistId && (!playlist.videos || playlist.videos.length === 0)) {
                    setPlayerSrc(`https://www.youtube.com/embed/videoseries?list=${encodeURIComponent(playlist.playlistId)}&autoplay=1`);
                    const note = el('div', '', 'Using main playlist loader directly. Individual video selection requires scraper data to complete. Video playlist menu may appear in the player.');
                    note.style.cssText = 'padding: 1.5rem; color:#888; text-align:center; font-size:0.9rem;';
                    videoSidebar.appendChild(note);
                } else if (playlist.videos && playlist.videos.length > 0) {
                    const list = encodeURIComponent(playlist.playlistId || '');
                    setPlayerSrc(`https://www.youtube.com/embed/${encodeURIComponent(playlist.videos[0].videoId)}?list=${list}&autoplay=1`);

                    const fragment = document.createDocumentFragment();
                    playlist.videos.forEach((vid, idx) => {
                        const vItem = el('div', 'video-item');
                        vItem.tabIndex = 0;
                        vItem.setAttribute('role', 'button');
                        if (idx === 0) vItem.classList.add('active');
                        vItem.append(el('div', 'video-item-number', idx + 1), el('div', 'video-item-title', vid.title));

                        const play = () => {
                            videoSidebar.querySelectorAll('.video-item.active').forEach(item => item.classList.remove('active'));
                            vItem.classList.add('active');
                            setPlayerSrc(`https://www.youtube.com/embed/${encodeURIComponent(vid.videoId)}?list=${list}&autoplay=1`);
                        };
                        vItem.addEventListener('click', play);
                        vItem.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); }
                        });
                        fragment.appendChild(vItem);
                    });
                    videoSidebar.appendChild(fragment);
                } else {
                    setPlayerSrc('');
                }

                overlay.classList.add('active');
                overlay.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden'; // prevent background scrolling
                closeBtn.focus({ preventScroll: true });
            }

            function closeModal() {
                overlay.classList.remove('active');
                overlay.setAttribute('aria-hidden', 'true');
                setPlayerSrc(''); // Stop video playback
                document.body.style.overflow = '';
                if (lastFocused && lastFocused.focus) lastFocused.focus({ preventScroll: true });
            }

            closeBtn.addEventListener('click', closeModal);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    closeModal();
                }
            });

            // Close on escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && overlay.classList.contains('active')) {
                    closeModal();
                }
            });
        });
    </script>
</body>

</html>
